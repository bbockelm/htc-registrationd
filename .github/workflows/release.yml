name: Release

# Builds the x86_64 and aarch64 RPMs and installs the x86_64 one on Rocky
# Linux 9 as a check. On a pushed v* tag, it then attaches both RPMs and
# SHA256SUMS to the GitHub release for the tag, creating the release if it
# does not exist. Pull requests, pushes to main and manual runs build and
# check the RPMs without publishing; the RPMs are kept as a workflow
# artifact.

# One in-flight run per pull request; a new push cancels the previous run.
# Tag and main pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GOWORK: 'off'

jobs:
  build:
    name: Build RPMs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      rpm-version: ${{ steps.version.outputs.rpm-version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # git describe needs the tags.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'
        cache: true

    # On a tag, the version is the tag. Otherwise it is git describe, which
    # packaging/rpm-version.sh turns into a release that sorts below the
    # next tag.
    - name: Determine version
      id: version
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          version="${GITHUB_REF_NAME}"
        else
          version="$(git describe --tags --always)"
        fi
        set -- $(packaging/rpm-version.sh "${version}")
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "rpm-version=$1-$2" >> "$GITHUB_OUTPUT"
        echo "htc-registrationd ${version}: RPM $1-$2"

    - name: Install nfpm (version pinned in .github/tools)
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        (cd .github/tools && go build -o "$RUNNER_TEMP/bin/nfpm" github.com/goreleaser/nfpm/v2/cmd/nfpm)

    - name: Build RPMs (amd64, arm64)
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        for arch in amd64 arm64; do
          make rpm NFPM="$RUNNER_TEMP/bin/nfpm" PKG_ARCH="${arch}" VERSION="${VERSION}"
        done
        (cd dist && sha256sum *.rpm > SHA256SUMS)
        cat dist/SHA256SUMS

    - name: Upload RPMs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rpms
        path: |
          dist/*.rpm
          dist/SHA256SUMS
        if-no-files-found: error
        retention-days: 7

  install-test:
    name: Install test (Rocky Linux 9)
    needs: build
    runs-on: ubuntu-latest
    container: rockylinux:9
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RPM_VERSION: ${{ needs.build.outputs.rpm-version }}
    steps:
    - name: Download RPMs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: rpms
        path: dist

    - name: Check checksums
      working-directory: dist
      run: sha256sum --check SHA256SUMS

    - name: Check package metadata and contents
      run: |
        set -euxo pipefail
        rpm="dist/htc-registrationd-${RPM_VERSION}.x86_64.rpm"
        rpm -qip "${rpm}"
        test "$(rpm -qp --qf '%{LICENSE}' "${rpm}")" = Apache-2.0
        test "$(rpm -qp --qf '%{URL}' "${rpm}")" = https://github.com/bbockelm/htc-registrationd
        rpm -qp --requires "${rpm}" | grep -qx condor
        rpm -qlp "${rpm}" | tee files.txt
        for f in /usr/sbin/htc-registrationd /usr/bin/htc-registration \
            /etc/condor-ce/config.d/50-htc-registrationd-ce.conf \
            /etc/condor-ce/config.d/50-htc-registrationd-registrar.conf \
            /usr/share/doc/htc-registrationd/README.md \
            /usr/share/doc/htc-registrationd/protocol.md \
            /usr/share/licenses/htc-registrationd/LICENSE; do
          grep -qx "$f" files.txt
        done
        rpm -qp --configfiles "${rpm}" | grep -qx /etc/condor-ce/config.d/50-htc-registrationd-ce.conf
        rpm -qp --configfiles "${rpm}" | grep -qx /etc/condor-ce/config.d/50-htc-registrationd-registrar.conf
        test "$(rpm -qp --qf '%{ARCH}' "dist/htc-registrationd-${RPM_VERSION}.aarch64.rpm")" = aarch64

    # The RPM requires the condor package, which is in HTCondor's own
    # repository, not in Rocky Linux. Installing HTCondor would test
    # HTCondor's packaging, not this one, so the dependency is skipped.
    - name: Install
      run: rpm -i --nodeps "dist/htc-registrationd-${RPM_VERSION}.x86_64.rpm"

    - name: Check the installed files
      run: |
        set -euxo pipefail
        out="$(htc-registrationd -version)"
        echo "${out}"
        test "${out}" = "htc-registrationd ${VERSION}"
        test "$(readlink /usr/bin/htc-registration)" = /usr/sbin/htc-registrationd
        # Invoked as htc-registration, the binary is the command-line tool,
        # which prints its usage when given no command.
        rc=0; htc-registration 2> usage.txt || rc=$?
        cat usage.txt
        test "${rc}" = 2
        grep -q '^usage: htc-registration' usage.txt
        for f in 50-htc-registrationd-ce.conf 50-htc-registrationd-registrar.conf; do
          test -f "/etc/condor-ce/config.d/$f"
        done
        # Installing starts nothing: the lines that enable the daemon are
        # commented out.
        if grep '^DAEMON_LIST' /etc/condor-ce/config.d/50-htc-registrationd-*.conf; then
          exit 1
        fi
        grep -q '^#DAEMON_LIST' /etc/condor-ce/config.d/50-htc-registrationd-ce.conf
        grep -q '^#DAEMON_LIST' /etc/condor-ce/config.d/50-htc-registrationd-registrar.conf

    - name: Uninstall
      run: |
        rpm -e htc-registrationd
        test ! -e /usr/sbin/htc-registrationd

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, install-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download RPMs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: rpms
        path: dist

    # Uses the runner's gh CLI. A re-run, or a release created by hand,
    # gets its assets replaced. A tag with a suffix (v1.0.0-rc1) is marked
    # as a pre-release.
    - name: Create or update the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        assets=(dist/*.rpm dist/SHA256SUMS)
        ls -l "${assets[@]}"
        if gh release view "${TAG}" >/dev/null 2>&1; then
          gh release upload "${TAG}" "${assets[@]}" --clobber
        else
          prerelease=()
          case "${TAG}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${TAG}" "${assets[@]}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes \
            "${prerelease[@]}"
        fi
