# htc-registrationd on an HTCondor-CE Central Collector: verifies CE
# registration requests and mints the short-lived IDTOKENs CEs advertise with.
#
# Installing the package does NOT enable the daemon. Every line that would
# start it is commented out, so a package upgrade never turns a service on.
# To run the registrar on this collector, uncomment the two lines under
# "enable".
#
# The package also installs 50-htc-registrationd-ce.conf beside this file,
# for CEs. Enable the daemon in one of the two only.
#
# This file is %config(noreplace): your edits survive an upgrade, and the
# package's version of the file is written alongside as .rpmnew.

# --- daemon under the master -----------------------------------------------
HTC_REGISTRATIOND      = /usr/sbin/htc-registrationd
# A DaemonCore daemon: the master hands it a shared-port endpoint named after
# the -sock argument, so the registrar is reachable at
# <$(FULL_HOSTNAME):$(SHARED_PORT_PORT)?sock=htc_registrationd>, which is
# where CEs look for it by default.
DC_DAEMON_LIST         = $(DC_DAEMON_LIST) +HTC_REGISTRATIOND
HTC_REGISTRATIOND_ARGS = -sock htc_registrationd

# --- enable ----------------------------------------------------------------
#DAEMON_LIST            = $(DAEMON_LIST) HTC_REGISTRATIOND
#HTC_REGISTRATIOND_MODE = registrar

# --- logging ---------------------------------------------------------------
HTC_REGISTRATIOND_LOG      = $(LOG)/HtcRegistrationdLog
MAX_HTC_REGISTRATIOND_LOG  = 10000000
#HTC_REGISTRATIOND_DEBUG   = general:debug cedar:info

# --- persistent state ------------------------------------------------------
# The registrar database lives in $(SPOOL)/htc-registrationd; naming it keeps
# condor_preen from removing it.
VALID_SPOOL_FILES = $(VALID_SPOOL_FILES) htc-registrationd

# --- token issuance --------------------------------------------------------
# The name of the signing key file in SEC_PASSWORD_DIRECTORY
# (/etc/condor-ce/passwords.d on an HTCondor-CE). The directory stays
# root-owned; the daemon reads the key as root. The collector verifies the
# tokens with the same key, so the key must be in the collector's
# SEC_PASSWORD_DIRECTORY too.
HTC_REGISTRATIOND_SIGNING_KEY = ce-registration
#
#HTC_REGISTRATIOND_TOKEN_LIFETIME = 72h
#HTC_REGISTRATIOND_TOKEN_LIMITS   = ADVERTISE_SCHEDD
#
# Which names callback mode may register: authz (an authorization backend
# decides) or any (every name proven by a trusted certificate).
#HTC_REGISTRATIOND_CALLBACK_NAMES = authz
#
# Where administrators approve approval-mode requests.
#HTC_REGISTRATIOND_VERIFICATION_URI = https://$(FULL_HOSTNAME)/approve
