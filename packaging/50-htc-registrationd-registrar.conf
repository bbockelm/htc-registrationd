# htc-registrationd on an HTCondor-CE Central Collector: verifies CE
# registration requests and mints the short-lived IDTOKENs CEs advertise with.
#
# Installing the package does NOT enable the daemon. Every line that would
# start it is commented out, so a package upgrade never turns a service on.
# To run the registrar on this collector, uncomment the three lines under
# "enable".
#
# The package also installs 50-htc-registrationd-ce.conf beside this file,
# for CEs. Enable the daemon in one of the two only.
#
# This file is %config(noreplace): your edits survive an upgrade, and the
# package's version of the file is written alongside as .rpmnew.

# --- daemon under the master -----------------------------------------------
HTC_REGISTRATIOND      = /usr/sbin/htc-registrationd
# A DaemonCore daemon: the master hands it a shared-port endpoint named after
# the -sock argument, so the registrar is reachable at
# <$(FULL_HOSTNAME):$(SHARED_PORT_PORT)?sock=htc_registrationd>, which is
# where CEs look for it by default.
DC_DAEMON_LIST         = $(DC_DAEMON_LIST) +HTC_REGISTRATIOND
HTC_REGISTRATIOND_ARGS = -sock htc_registrationd

# --- enable ----------------------------------------------------------------
#DAEMON_LIST            = $(DAEMON_LIST) HTC_REGISTRATIOND
#HTC_REGISTRATIOND_MODE = registrar
# The collector accepts the CEs' tokens for ADVERTISE_SCHEDD. HTCondor-CE's
# default allows SSL only; SSL stays for CEs that still use a certificate.
#COLLECTOR.SEC_ADVERTISE_SCHEDD_AUTHENTICATION_METHODS = TOKEN, SSL

# --- logging ---------------------------------------------------------------
HTC_REGISTRATIOND_LOG      = $(LOG)/HtcRegistrationdLog
MAX_HTC_REGISTRATIOND_LOG  = 10000000
#HTC_REGISTRATIOND_DEBUG   = general:debug cedar:info

# --- persistent state ------------------------------------------------------
# The registrar database lives in $(SPOOL)/htc-registrationd; naming it keeps
# condor_preen from removing it.
VALID_SPOOL_FILES = $(VALID_SPOOL_FILES) htc-registrationd

# --- token issuance --------------------------------------------------------
# The name of the signing key file in SEC_PASSWORD_DIRECTORY
# (/etc/condor-ce/passwords.d on an HTCondor-CE). When the file does not
# exist, the registrar creates it at startup and on every reconfig: 64 random
# bytes, root-owned, mode 0600, in the format HTCondor writes. An existing
# file is never replaced. The directory stays root-owned; the daemon creates
# and reads the key as root. The collector on this host shares
# SEC_PASSWORD_DIRECTORY, so it verifies the tokens with the same file.
#
# With two central collectors, a CE may advertise to either, so both must
# accept its token: copy this key file into the other collector's
# SEC_PASSWORD_DIRECTORY (root-owned, mode 0600) and give both the same
# TRUST_DOMAIN, the tokens' issuer. If a registrar there already created its
# own key, replace that file with the copy.
HTC_REGISTRATIOND_SIGNING_KEY = ce-registration
#
#HTC_REGISTRATIOND_TOKEN_LIFETIME = 72h
#HTC_REGISTRATIOND_TOKEN_LIMITS   = ADVERTISE_SCHEDD
#
# Which names callback mode may register: authz (an authorization backend
# decides) or any (every name proven by a trusted certificate).
#HTC_REGISTRATIOND_CALLBACK_NAMES = authz
#
# Where administrators approve approval-mode requests. The default is
# $(HTC_REGISTRATIOND_PUBLIC_URL)/approve when the web UI is configured, else
# https://$(FULL_HOSTNAME)/approve.
#HTC_REGISTRATIOND_VERIFICATION_URI = https://$(FULL_HOSTNAME)/approve
#
# Approval-mode renewal: the refresh secret outlives the 72 h token. It stops
# working after this long unused, or when the registration reaches
# MAX_REGISTRATION_AGE (no cap by default).
#HTC_REGISTRATIOND_REFRESH_IDLE_LIFETIME = 720h

# --- web UI ----------------------------------------------------------------
# Administrators approve approval-mode requests in the registrar's web UI,
# served on the collector's shared port (9619 on an HTCondor-CE), with no
# port of its own: the shared port passes every connection that opens with
# an HTTP request or a TLS ClientHello to the endpoint
# SHARED_PORT_HTTP_FORWARDING_ID names, and CEDAR commands to the registrar
# arrive on the same port as before. Needs HTCondor 25.7.2 or later.
#
# Only one daemon per host can be that endpoint. On a host that also runs
# htcondor-api (HTTP_API in DAEMON_LIST, the endpoint when this is unset),
# choose one; the other needs a port of its own (HTC_REGISTRATIOND_HTTPS_ADDR
# here). The shared port reads this at startup and on reconfig; the
# registrar reads it at startup.
#SHARED_PORT_HTTP_FORWARDING_ID = htc_registrationd
#
# The UI is served once PUBLIC_URL is set to the shared port's origin. TLS
# ends in the registrar, with this certificate and key (the key may be
# root-only, mode 0600). Register $(HTC_REGISTRATIOND_PUBLIC_URL)/oidc/callback
# as the OIDC client's redirect URI.
#HTC_REGISTRATIOND_PUBLIC_URL       = https://$(FULL_HOSTNAME):9619
#HTC_REGISTRATIOND_HTTPS_CERTFILE   = /etc/grid-security/hostcert.pem
#HTC_REGISTRATIOND_HTTPS_KEYFILE    = /etc/grid-security/hostkey.pem
#HTC_REGISTRATIOND_OIDC_ISSUER      = https://cilogon.org
#HTC_REGISTRATIOND_OIDC_CLIENT_ID   = cilogon:/client_id/...
#HTC_REGISTRATIOND_OIDC_CLIENT_SECRET_FILE = /etc/condor-ce/htc-registrationd-oidc-secret
#HTC_REGISTRATIOND_ADMINS           =
#
# A port of its own instead, or as well:
#HTC_REGISTRATIOND_HTTPS_ADDR       = :8443
