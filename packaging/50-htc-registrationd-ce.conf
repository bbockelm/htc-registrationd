# htc-registrationd on an HTCondor-CE: obtains, installs and renews the
# IDTOKEN this CE uses to advertise its Scheduler ad to the CE-Collector.
#
# Installing the package does NOT enable the daemon. Every line that would
# start it is commented out, so a package upgrade never turns a service on.
# To run it on this CE, uncomment the two lines under "enable".
#
# The package also installs 50-htc-registrationd-registrar.conf beside this
# file, for the CE-Collector. Enable the daemon in one of the two only.
#
# This file is %config(noreplace): your edits survive an upgrade, and the
# package's version of the file is written alongside as .rpmnew.

# --- daemon under the master -----------------------------------------------
HTC_REGISTRATIOND      = /usr/sbin/htc-registrationd
# A DaemonCore daemon: the master hands it a shared-port endpoint, named after
# the -sock argument.
DC_DAEMON_LIST         = $(DC_DAEMON_LIST) +HTC_REGISTRATIOND
HTC_REGISTRATIOND_ARGS = -sock htc_registrationd

# --- enable ----------------------------------------------------------------
#DAEMON_LIST            = $(DAEMON_LIST) HTC_REGISTRATIOND
#HTC_REGISTRATIOND_MODE = ce

# --- logging ---------------------------------------------------------------
HTC_REGISTRATIOND_LOG      = $(LOG)/HtcRegistrationdLog
MAX_HTC_REGISTRATIOND_LOG  = 10000000
#HTC_REGISTRATIOND_DEBUG   = general:debug cedar:info

# --- persistent state ------------------------------------------------------
# The registration state lives in $(SPOOL)/htc-registrationd; naming it keeps
# condor_preen from removing it.
VALID_SPOOL_FILES = $(VALID_SPOOL_FILES) htc-registrationd

# --- registration ----------------------------------------------------------
# The registrar defaults to the first CONDOR_VIEW_HOST entry's host:port with
# sock=htc_registrationd, so a CE that already advertises to its CE-Collector
# needs nothing here. Override it when the registrar lives elsewhere:
#HTC_REGISTRATIOND_REGISTRAR = <collector.example.org:9619?sock=htc_registrationd>
#
# How the CE proves its name: callback (its SSL server certificate),
# approval (an administrator approves it), or auto (callback when a server
# certificate is configured, else approval).
#HTC_REGISTRATIOND_METHOD = auto
#
# The token is written to $(SEC_TOKEN_SYSTEM_DIRECTORY)/50-htc-registration,
# which on an HTCondor-CE is /etc/condor-ce/tokens.d. The htcondor-ce package
# creates that directory owned by condor, mode 0700, so the daemon, running as
# condor, writes there directly.
#HTC_REGISTRATIOND_TOKEN_FILE = $(SEC_TOKEN_SYSTEM_DIRECTORY)/50-htc-registration
