# Package definition for htc-registrationd, built by `make rpm`.
name: htc-registrationd
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
version_schema: none
section: net
priority: optional
maintainer: ${PKG_MAINTAINER}
description: |
  htc-registrationd gets an HTCondor-CE a short-lived IDTOKEN for
  advertising its Scheduler ad to a central CE-Collector, and renews the
  token before it expires. A CE proves its name with its TLS server
  certificate, or an administrator approves it in a web page after signing
  in with OpenID Connect.

  The same program runs on the CE and on the CE-Collector host, under
  condor_ce_master. The package installs the daemon, the htc-registration
  command-line tool, and one configuration file for each role in
  /etc/condor-ce/config.d. Installing the package starts nothing.
vendor: ${PKG_VENDOR}
license: Apache-2.0
homepage: https://github.com/bbockelm/htc-registrationd

depends:
  # Started by condor_master and reads the pool configuration.
  - condor

contents:
  # Staged by `make rpm` (PKG_STAGE): nfpm expands environment variables in
  # scalar fields but globs contents.src literally, so a ${...} here finds no
  # files. This path and PKG_STAGE are one fact written twice.
  - src: packaging/staging/htc-registrationd
    dst: /usr/sbin/htc-registrationd
    file_info:
      mode: 0755

  # The command-line tool is the same binary, selected by its name.
  - src: /usr/sbin/htc-registrationd
    dst: /usr/bin/htc-registration
    type: symlink

  - src: packaging/50-htc-registrationd-ce.conf
    dst: /etc/condor-ce/config.d/50-htc-registrationd-ce.conf
    type: config|noreplace
    file_info:
      mode: 0644

  - src: packaging/50-htc-registrationd-registrar.conf
    dst: /etc/condor-ce/config.d/50-htc-registrationd-registrar.conf
    type: config|noreplace
    file_info:
      mode: 0644

  - src: README.md
    dst: /usr/share/doc/htc-registrationd/README.md
    type: doc
    file_info:
      mode: 0644

  - src: docs/protocol.md
    dst: /usr/share/doc/htc-registrationd/protocol.md
    type: doc
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/licenses/htc-registrationd/LICENSE
    type: license
    file_info:
      mode: 0644

rpm:
  summary: Gets and renews the IDTOKEN an HTCondor-CE uses to advertise to its CE-Collector
  group: System Environment/Daemons
  # Compression that every EL8+ host can read.
  compression: gzip
